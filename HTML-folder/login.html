<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | nextline CV Studio</title>
    <link rel="shortcut icon" href="../assets/icons/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../CSS-folder/common.css" />
    <link rel="stylesheet" href="../CSS-folder/login.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="./index.html" class="brand" aria-label="nextline home">
          <div class="brand-mark">N</div>
          <span>nextline CV STUDIO</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./templates.html">Templates</a>
          <a href="./editor.html">CV Builder</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <span class="eyebrow">Welcome back</span>
        <h1 id="login-title">Log in</h1>
        <p class="auth-copy">Continue building your next chapter with your saved CV.</p>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <div class="form-footer">
            <label class="check-row" for="remember">
              <input id="remember" type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="auth-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Log in</button>
          <div id="login-message" class="form-message" aria-live="polite"></div>
        </form>

        <p style="margin-top: 22px; text-align: center; color: var(--muted);">
          New here? <a href="./signup.html" class="auth-link">Create an account</a>
        </p>
      </section>
    </main>

    <script src="../JS-folder/login.js"></script>
  </body>
</html>
