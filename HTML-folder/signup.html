<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | nextline CV Studio</title>
    <link rel="shortcut icon" href="../assets/icons/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../CSS-folder/common.css" />
    <link rel="stylesheet" href="../CSS-folder/signup.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="./index.html" class="brand" aria-label="nextline home">
          <div class="brand-mark">N</div>
          <span>nextline CV STUDIO</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./templates.html">Templates</a>
          <a href="./editor.html">CV Builder</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="signup-title">
        <span class="eyebrow">Start free</span>
        <h1 id="signup-title">Create your account</h1>
        <p class="auth-copy">Join thousands of job seekers building profiles that stand out.</p>

        <form id="signup-form" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="firstName">First name</label>
              <input id="firstName" name="firstName" type="text" placeholder="Alex" required />
            </div>

            <div class="form-field">
              <label for="lastName">Last name</label>
              <input id="lastName" name="lastName" type="text" placeholder="Morgan" required />
            </div>

            <div class="form-field full">
              <label for="signupEmail">Email</label>
              <input id="signupEmail" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="form-field full">
              <label for="signupPassword">Password</label>
              <input id="signupPassword" name="password" type="password" placeholder="Create a strong password" required />
            </div>
          </div>

          <div class="auth-actions">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create account</button>
          </div>

          <div id="signup-message" class="form-message" aria-live="polite"></div>
        </form>

        <p style="margin-top: 22px; text-align: center; color: var(--muted);">
          Already have an account? <a href="./login.html" class="auth-link">Log in</a>
        </p>
      </section>
    </main>

    <script src="../JS-folder/signup.js"></script>
  </body>
</html>
